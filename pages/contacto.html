<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecno Productos - Centro de Ayuda</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../Logo compania.png">

    <!-- Stylesheets & Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>

    <!-- ==========================================================================
    HEADER 
    ========================================================================== -->
    <header>
        <!-- Topbar / Barra de utilidades -->
        <div class="barra-negra">
            <div class="contenedorlinks-barra">
                <!-- Navegación principal -->
                <nav class="links-barranegra">
                    <ul>
                        <li><a href="../index.html">Inicio</a></li>
                        <li><a href="../index.html#productos-destacados">🔥 Hotsale</a></li> 
                        <li><a href="sucursales.html">📍 Sucursales</a></li> 
                        <li><a href="contacto.html">📞 Centro de Ayuda</a></li> 
                    </ul>
                </nav>
                
                <!-- Redes Sociales -->
                <div class="redes-barranegra">
                    <i class='bx bxl-facebook-circle'></i>
                    <i class='bx bxl-instagram'></i>
                </div>
            </div>
        </div>

        <!-- Navbar principal -->
        <div class="barra-azul">
            <div class="contenedor-header">
                <!-- Brand Logo -->
                <div class="logocompania">
                    <img src="../Logo compania.png" alt="Logo de Tecno Productos"> 
                </div>

                <!-- Buscador global -->
                <div class="buscador">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="Buscar productos, marcas and más...">
                        <button class="btn btn-dark" type="button">
                            <i class='bx bx-search'></i>
                        </button>
                    </div>
                </div>

                <!-- Acceso al Carrito -->
                <div class="carrito-header">
                    <a href="#" id="ver-carrito" title="Ver carrito">
                        <i class='bx bx-shopping-bag'></i>
                        <span id="contador-carrito">0</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- ==========================================================================
    MAIN CONTENT (CENTRO DE AYUDA)
    ========================================================================== -->
    <main class="contenedor-contacto">
        <div class="pantalla-contacto">
            <section class="contacto-basico">
                <h2>Centro de Ayuda</h2>
                
                <form id="form-contacto" action="https://formspree.io/f/mkolygvk" method="POST">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribí tu nombre" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Escribí tu email" required>

                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" placeholder="¿En qué te ayudamos?" rows="5" required></textarea>

                    <button type="submit">Enviar Consulta</button>
                </form>
            </section>
        </div>
    </main>

    <!-- ==========================================================================
    FOOTER
    ========================================================================== -->
    <footer>
        <div class="footer-container">
            <!-- Enlaces informativos -->
            <div class="footer-info">
                <h3>Nuestros Servicios</h3>
                <ul>
                    <li>Garantía Extendida</li>
                    <li>Soporte Técnico Especializado</li>
                    <li>Envíos a Todo el País</li>
                </ul>
            </div>
        </div>
    </footer>

    <!-- ==========================================================================
    SCRIPTS
    ========================================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
</body>
</html>
