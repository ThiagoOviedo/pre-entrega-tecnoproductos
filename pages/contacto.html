<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecno Productos - Centro de Ayuda</title>
    <link rel="stylesheet" href="../css/index.css">
    <link rel="icon" type="image/png" href="../Logo compania.png">
</head>
<body>

    <header>
        <div class="barra-negra">
            <div class="contenedorlinks-barra">
                <nav class="links-barranegra">
                    <a href="sucursales.html">📍 Sucursales</a>
                    <a href="contacto.html">📞 Centro de Ayuda</a>
                    <a href="../index.html">🔥 Hotsale</a>
                </nav>
                <div class="redes-barranegra">
                    <i class='bx bxl-facebook-circle'></i>
                    <i class='bx bxl-instagram'></i>
                </div>
            </div>
        </div>

        <div class="barra-azul">
            <div class="contenedor-header">
                <div class="logocompania">
                    <img src="../Logo compania.png" alt="Logo">
                </div>
                <div class="buscador">
                    <div class="input-group">
                        <input type="text" class="form-control" placeholder="¿En qué te ayudamos?">
                        <button class="btn btn-dark" type="button"><i class='bx bx-search'></i></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="contenedor-contacto">
        <div class="pantalla-contacto">
            <section class="contacto-basico">
                <h2>Centro de Ayuda</h2>
                <form>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Escribí tu nombre">

                    <label for="email">Email:</label>
                    <input type="email" id="email" placeholder="Escribí tu email">

                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" placeholder="¿En qué te ayudamos?" rows="5"></textarea>

                    <button type="submit">Enviar Consulta</button>
                </form>
            </section>
        </div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-info">
                <h3>Nuestros Servicios</h3>
                <ul>
                    <li>Garantía Extendida</li>
                    <li>Soporte Técnico Especializado</li>
                    <li>Envíos a Todo el País</li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
